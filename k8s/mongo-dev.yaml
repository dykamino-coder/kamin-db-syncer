# Single-node MongoDB for a test cluster only. In production use your managed MongoDB / replica set.
apiVersion: v1
kind: Namespace
metadata:
  name: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:8.0.32
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: kamin-db-syncer }
            - { name: MONGO_INITDB_ROOT_PASSWORD, value: CHANGE_ME }
          ports:
            - { containerPort: 27017 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: mongo
spec:
  clusterIP: None
  selector: { app: mongo }
  ports:
    - { port: 27017 }
